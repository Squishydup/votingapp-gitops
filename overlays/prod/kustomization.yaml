apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vote-prod
resources:
- ../../base
labels:
- pairs:
    environment: prod
  includeSelectors: false
  includeTemplates: true
replicas:
- name: vote
  count: 2
configMapGenerator:
- name: vote-config
  behavior: merge
  literals:
  - OPTION_A=Chats
  - OPTION_B=Chiens
patches:
- target:
    kind: Ingress
    name: voting-app
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: vote.local
    - op: replace
      path: /spec/rules/1/host
      value: result.local
