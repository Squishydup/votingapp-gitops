apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vote-dev
resources:
- ../../base
labels:
- pairs:
    environment: dev
  includeSelectors: false
  includeTemplates: true
replicas:
- name: vote
  count: 1
configMapGenerator:
- name: vote-config
  behavior: merge
  literals:
  - OPTION_A=Thé (dev)
  - OPTION_B=Chiens (dev)
patches:
- target:
    kind: Ingress
    name: voting-app
  patch: |-
    - op: replace
      path: /spec/rules/0/host
      value: vote-dev.local
    - op: replace
      path: /spec/rules/1/host
      value: result-dev.local
